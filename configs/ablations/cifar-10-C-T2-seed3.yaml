experiment_name: cifar-10-C-T2-seed3
seed: 3
deterministic: true
device: auto
data:
  root: data
  download: false
  validation_size: 5000
  workers: 0
model:
  name: cellular_resnet18
  num_classes: 10
  communication_iterations: 2
  residual_scale: 1.0
  neighbourhood_kernel_size: 3
  share_communication_weights: true
  communication_type: depthwise_local
training:
  epochs: 200
  batch_size: 128
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
output_root: runs
dataset: CIFAR-10
